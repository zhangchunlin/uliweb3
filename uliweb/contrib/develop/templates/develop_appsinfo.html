{{extend "develop_layout.html"}}

{{block title}}Apps Info{{end title}}

{{block menu}}
{{<<functions.dev_nav(active='appsinfo')}}
{{end}}

{{block content_main}}
<h2>Installed Apps</h2>
<div class="info-box">
    Total: {{=len(apps)}} apps
</div>
<table>
    <thead>
        <tr>
            <th>#</th>
            <th>App Name</th>
        </tr>
    </thead>
    <tbody>
    {{for i, p in enumerate(apps):}}
        <tr>
            <td>{{=i+1}}</td>
            <td><code>{{=p}}</code></td>
        </tr>
    {{pass}}
    </tbody>
</table>
{{end content_main}}
