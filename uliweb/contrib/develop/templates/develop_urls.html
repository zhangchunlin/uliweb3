{{extend "develop_layout.html"}}

{{block title}}URLs{{end title}}

{{block menu}}
{{<<functions.dev_nav(active='urls')}}
{{end}}

{{block content_main}}
<h2>URL Routes</h2>
<div class="info-box">
    Total: {{=len(urls)}} routes
</div>
<table>
    <thead>
        <tr>
            <th>#</th>
            <th>URL</th>
            <th>Methods</th>
            <th>View Function</th>
        </tr>
    </thead>
    <tbody>
    {{for i, (rule, methods, endpoint) in enumerate(urls):}}
        <tr>
            <td>{{=i+1}}</td>
            <td><a href="{{=rule}}">{{=rule}}</a></td>
            <td><code>{{=methods or 'GET'}}</code></td>
            <td><code>{{=endpoint}}</code></td>
        </tr>
    {{pass}}
    </tbody>
</table>
{{end}}
