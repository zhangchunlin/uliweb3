#!/bin/bash

# Uliweb3 使用 Uvicorn ASGI 服务器
# 安装: pip install uvicorn

projectdir={{=project_dir}}
logfile={{=log_dir}}/{{=project}}.log
host={{=host}}
port={{=port}}
workers={{=workers}}
log_level={{=log_level}}
reload={{=reload}}

if [ $1 = start ];then
    psid=`ps aux|grep "uvicorn"|grep -v "grep"|wc -l`
    if [ $psid -gt 1 ];then
        echo "uvicorn is running!"
        exit 0
    else
        if [ "$reload" = "True" ]; then
            uvicorn --host $host --port $port --log-level $log_level --reload "$projectdir.uliweb_asgi:application" --daemon
        else
            uvicorn --host $host --port $port --workers $workers --log-level $log_level "$projectdir.uliweb_asgi:application" --daemon
        fi
    fi
    echo "Start uvicorn service [OK]"
elif [ $1 = stop ];then
    pkill -f "uvicorn.*$projectdir"
    echo "Stop uvicorn service [OK]"
elif [ $1 = restart ];then
    pkill -f "uvicorn.*$projectdir"
    sleep 1
    if [ "$reload" = "True" ]; then
        uvicorn --host $host --port $port --log-level $log_level --reload "$projectdir.uliweb_asgi:application" --daemon
    else
        uvicorn --host $host --port $port --workers $workers --log-level $log_level "$projectdir.uliweb_asgi:application" --daemon
    fi
    echo "Restart uvicorn service [OK]"
else
    echo "Usages: sh start.sh [start|stop|restart]"
fi
