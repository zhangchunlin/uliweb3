#!/bin/bash

# Uliweb3 使用 Hypercorn ASGI 服务器
# 安装: pip install hypercorn

projectdir={{=project_dir}}
logfile={{=log_dir}}/{{=project}}.log
host={{=host}}
port={{=port}}
workers={{=workers}}
log_level={{=log_level}}

if [ $1 = start ];then
    psid=`ps aux|grep "hypercorn"|grep -v "grep"|wc -l`
    if [ $psid -gt 1 ];then
        echo "hypercorn is running!"
        exit 0
    else
        hypericorn --bind $host:$port --workers $workers --log-level $log_level --access-logfile $logfile "$projectdir.uliweb_asgi:application" --daemon
    fi
    echo "Start hypercorn service [OK]"
elif [ $1 = stop ];then
    pkill -f "hypercorn.*$projectdir"
    echo "Stop hypercorn service [OK]"
elif [ $1 = restart ];then
    pkill -f "hypercorn.*$projectdir"
    sleep 1
    hypericorn --bind $host:$port --workers $workers --log-level $log_level --access-logfile $logfile "$projectdir.uliweb_asgi:application" --daemon
    echo "Restart hypercorn service [OK]"
else
    echo "Usages: sh start.sh [start|stop|restart]"
fi
